[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlkit"
version = "0.1.0"
description = "NorthWave churn modelling toolkit"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["mlkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
